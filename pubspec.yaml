name: flutter_client
description: "A new Flutter chat client for Javacomm."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  
  # Networking & serialization
  web_socket_channel: ^3.0.1
  json_annotation: ^4.9.0
  
  # Crypto
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  
  # UI & Navigation
  go_router: ^14.2.1
  google_fonts: ^6.2.1
  
  # Utilities
  intl: ^0.19.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
