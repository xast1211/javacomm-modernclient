name: flutter_client
description: "JavaComm - Modern Chat Client"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Network
  http: ^1.2.0
  web_socket_channel: ^3.0.1
  json_annotation: ^4.9.0
  
  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  
  # Crypto
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  
  # UI & Navigation
  go_router: ^14.2.1
  google_fonts: ^6.2.1
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.2
  shared_preferences: ^2.2.2
  local_auth: ^2.3.0
  flutter_secure_storage: ^10.0.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  test: ^1.25.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
